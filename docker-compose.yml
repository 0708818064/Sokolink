version: "3.8"

services:
  # ---------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: sokolink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sokolink_user
      POSTGRES_PASSWORD: sokolink_password_2026
      POSTGRES_DB: sokolink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokolink_user -d sokolink_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sokolink_network

  # ---------------------------------------------
  # 2. Standalone Backend API Server (Port 5000)
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sokolink_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://sokolink_user:sokolink_password_2026@db:5432/sokolink_db?schema=public
      JWT_SECRET: sokolink_super_secret_jwt_key_2026_kenya_sme_secure
      CORS_ORIGIN: http://localhost:3000,http://10.202.146.182:3000
      MPESA_ENVIRONMENT: sandbox
      MPESA_CONSUMER_KEY: mock_daraja_consumer_key
      MPESA_CONSUMER_SECRET: mock_daraja_consumer_secret
      MPESA_PASSKEY: bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919
      MPESA_SHORTCODE: "174379"
      MPESA_CALLBACK_URL: http://10.202.146.182:5000/api/payments/mpesa/callback
    ports:
      - "5000:5000"
    networks:
      - sokolink_network

  # ---------------------------------------------
  # 3. Next.js Frontend Application (Port 3000)
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sokolink_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      DATABASE_URL: postgresql://sokolink_user:sokolink_password_2026@db:5432/sokolink_db?schema=public
      JWT_SECRET: sokolink_super_secret_jwt_key_2026_kenya_sme_secure
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    networks:
      - sokolink_network

volumes:
  postgres_data:
    driver: local

networks:
  sokolink_network:
    driver: bridge
